<script>
/* CARBON_ENGINE_BEGIN */
/* Oxygen audit v3.0 — statistics only; never modifies source audit records. */
(function(root) {
  'use strict';
  const DAY = 86400000;
  const SOURCE = 'Tariq M, et al. Life cycle assessment of medical oxygen. Journal of Cleaner Production. 2024;444:141126. DOI:10.1016/j.jclepro.2024.141126。依摘要 0.49 kg CO₂e/床日及 2 L/min 推算約 0.00017 kg CO₂e/L；北美液態氧供應之 cradle-to-gate 估算，非本院實測。';
  const DEFAULTS = { effective_date:'2026-07-01', beds:40, occupancy:1, oxygen_fraction:0.5, hours:24, carbon_kg_per_litre:0.00017, accumulation_start:'2026-07-01', max_flow_lpm:15, source_note:SOURCE };
  function number(v) {
    if (typeof v !== 'number' && typeof v !== 'string') return null;
    if (typeof v === 'string' && !v.trim()) return null;
    const n = Number(v); return Number.isFinite(n) ? n : null;
  }
  function dateKey(v) {
    if (v == null || (typeof v === 'string' && !v.trim())) return null;
    const d = v instanceof Date ? v : new Date(v);
    if (!Number.isFinite(d.getTime())) return null;
    return new Date(d.getTime()+8*3600000).toISOString().slice(0,10);
  }
  function day(key) { return Date.parse(key+'T00:00:00Z')/DAY; }
  function validDate(key) { return typeof key==='string' && /^\d{4}-\d{2}-\d{2}$/.test(key) && Number.isFinite(day(key)) && new Date(day(key)*DAY).toISOString().slice(0,10)===key; }
  function nextMonth(key) { const [y,m]=key.split('-').map(Number); return (m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`); }
  function roomAir(r) { const n=number(r.original_value); return n!==null && ((r.mode==='flow' && n===0) || (r.mode==='fio2' && (n===0 || n===21))); }
  function flow(mode, value, max=15) {
    const n=number(value);
    if(n===null) return {error:'缺值或非數值'};
    if(n<0) return {error:'負值'};
    if(mode==='flow') return n<=max ? {value:n} : {error:`流量超出分析上限 ${max} L/min`};
    if(mode!=='fio2') return {error:'未知給氧模式'};
    const map={0:0,21:0,30:6,35:8,40:10,50:12};
    return Object.prototype.hasOwnProperty.call(map,n) ? {value:map[n]} : {error:'未定義的 FiO₂'};
  }
  function validateParams(p) {
    const ranges={beds:[1,10000],occupancy:[0,1],oxygen_fraction:[0,1],hours:[0,24],carbon_kg_per_litre:[0,1],max_flow_lpm:[0.1,1000]};
    const errors=[];
    for(const [k,[lo,hi]] of Object.entries(ranges)){const n=number(p[k]);if(n===null||n<lo||n>hi||(k==='beds'&&!Number.isInteger(n)))errors.push(k);}
    if(!validDate(p.effective_date))errors.push('effective_date');
    if(!validDate(p.accumulation_start))errors.push('accumulation_start');
    if(typeof p.source_note!=='string'||!p.source_note.trim())errors.push('source_note');
    return errors;
  }
  function historyFor(settings, ward) {return settings.filter(p=>p.ward===ward).slice().sort((a,b)=>a.effective_date.localeCompare(b.effective_date));}
  function paramsAt(history,key){let found=null;for(const p of history){if(p.effective_date<=key)found=p;else break;}return found;}
  function hfncFlow(fio2, actualTotal) {
    const f=number(fio2);
    if(f===null || (f!==0 && (f<21 || f>100)))return {error:'HFNC FiO₂ 必須為 21–100%，停止用氧可填 0'};
    const supplied=actualTotal!=null && !(typeof actualTotal==='string' && !actualTotal.trim());
    const total=supplied?number(actualTotal):50;
    if(total===null || total<=0)return {error:'HFNC 實際總氣體流量必須為有限正數'};
    return {value:f===0?0:total*(f-21)/79,assumed:!supplied,total};
  }
  function hfncStages(r) {
    const text=[r.note,r.reason_note].filter(Boolean).join(' ');
    const explicit=typeof r.hfnc_before==='boolean' && typeof r.hfnc_after==='boolean';
    const detected=r.is_hfnc===true || /\bHFNC\b|高流量鼻(?:導管|氧)/i.test(text);
    if(explicit)return {before:r.hfnc_before,after:r.hfnc_after};
    if(detected && /(?:->|→|改|換).*(?:venturi|面罩|鼻導管|nasal|N\/C|\bNC\b)/i.test(text))return {error:'HFNC 與一般裝置轉換，請確認調整前／後 HFNC 階段'};
    return {before:detected,after:detected};
  }
  function classify(r,p) {
    const stages=hfncStages(r);
    if(stages.error)return {kind:'invalid',reason:stages.error};
    const hfnc=stages.before||stages.after;
    if(hfnc && r.mode!=='fio2')return {kind:'invalid',reason:'HFNC 需以 FiO₂ 百分比記錄，不能將 L/min 當成 FiO₂'};
    if(roomAir(r))return {kind:'room_air'};
    if(!p || validateParams(p).length)return {kind:'invalid',reason:'缺少有效病房參數'};
    const a=stages.before?hfncFlow(r.original_value,r.hfnc_total_flow_before):flow(r.mode,r.original_value,Number(p.max_flow_lpm));
    const b=stages.after?hfncFlow(r.adjusted_value,r.hfnc_total_flow_after):flow(r.mode,r.adjusted_value,Number(p.max_flow_lpm));
    if(a.error||b.error)return {kind:'invalid',reason:[a.error&&'原值：'+a.error,b.error&&'調整後：'+b.error].filter(Boolean).join('；')};
    return {kind:'valid',before:a.value,after:b.value,net:a.value-b.value,hfnc,assumedHFNC:!!(a.assumed||b.assumed)};
  }
  function metrics(rows,history) {
    let over=0,unknownPrevalence=0,before=0,after=0,count=0,downCount=0,down=0,room=0,hfnc=0,assumedHFNC=0,unknownHFNC=0;
    const issues=[];
    for(const r of rows){
      const air=roomAir(r),s=number(r.spo2),o=number(r.original_value);
      if(!air){if(o!==null && o>0 && ['flow','fio2'].includes(r.mode) && (r.mode!=='fio2'||(o>=21&&o<=100)) && s!==null && s>=0 && s<=100){if(s>(r.copd?92:96))over++;}else unknownPrevalence++;}
      const c=classify(r,paramsAt(history,dateKey(r.created_at)));
      if(c.kind==='valid'){if(c.hfnc)hfnc++;if(c.assumedHFNC)assumedHFNC++;if(r.is_hfnc==null&&!c.hfnc)unknownHFNC++;count++;before+=c.before;after+=c.after;if(c.net>0){downCount++;down+=c.net;}}
      else if(c.kind==='room_air')room++;
      else {if(c.kind==='hfnc')hfnc++;issues.push({id:r.id,ward:r.ward,date:dateKey(r.created_at),reason:c.kind==='hfnc'?'HFNC 標記或註記（排除）':c.reason});}
    }
    return {total:rows.length,over,prevalence:rows.length?over/rows.length:null,unknownPrevalence,count,before:count?before/count:null,after:count?after/count:null,net:count?(before-after)/count:null,downCount,down:downCount?down/downCount:null,room,hfnc,assumedHFNC,unknownHFNC,issues};
  }
  function estimate(month, net, history, today, extraStart=null) {
    const begin=month+'-01',end=new Date((day(nextMonth(month)+'-01')-1)*DAY).toISOString().slice(0,10),last=end<today?end:today;
    if(begin>last)return {oxygen:0,carbon:0,days:0,missing:false};
    let oxygen=0,carbon=0,days=0,missing=false;
    // Day-by-day integration handles effective-date changes, leap years and inclusive boundaries.
    for(let d=day(begin);d<=day(last);d++){
      const key=new Date(d*DAY).toISOString().slice(0,10);
      if(extraStart&&key<extraStart)continue;
      const p=paramsAt(history,key);
      if(!p){missing=true;continue;}
      if(key<p.accumulation_start)continue;

        const result={ward,month,...m,oxygen:e.days===0&&!e.missing?null:e.oxygen,carbon:e.days===0&&!e.missing?null:e.carbon,days:e.days,missingParams:e.missing,start,cumulativeOxygen:hasCumulative?cumulativeOxygen:null,cumulativeCarbon:hasCumulative?cumulativeCarbon:null,incomplete,applicable};

// ===== Supabase REST client =====
class SB {
  constructor(url, anonKey) {
    this.url = url.replace(/\/$/, '');
    this.anonKey = anonKey;
  }
  _h(token) {
    return {
      apikey: this.anonKey,
      Authorization: `Bearer ${token || this.anonKey}`,
      'Content-Type': 'application/json',
    };
  }
  async signIn(email, password) {
    const r = await fetch(`${this.url}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: this.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error_description || d.msg || d.message || '登入失敗');
    return d;
  }
  async refresh(refresh_token) {
    const r = await fetch(`${this.url}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: this.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token }),
    });
    if (!r.ok) throw new Error('SESSION_EXPIRED');
    return r.json();
  }
  async insert(table, row, token) {
    const r = await fetch(`${this.url}/rest/v1/${table}`, {
      method: 'POST',
      headers: { ...this._h(token), Prefer: 'return=representation' },
      body: JSON.stringify(row),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async update(table, query, patch, token) {
    const r = await fetch(`${this.url}/rest/v1/${table}?${query}`, {
      method: 'PATCH',
      headers: { ...this._h(token), Prefer: 'return=representation' },
      body: JSON.stringify(patch),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async updateOwnPassword(newPassword, token) {
    const r = await fetch(`${this.url}/auth/v1/user`, {
      method: 'PUT',
      headers: { ...this._h(token) },
      body: JSON.stringify({ password: newPassword }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.msg || d.error_description || d.message || '更新密碼失敗');
    return d;
  }
  async upsert(table, row, token) {
    const r = await fetch(`${this.url}/rest/v1/${table}`, {
      method: 'POST',
      headers: { ...this._h(token), Prefer: 'return=representation,resolution=merge-duplicates' },
      body: JSON.stringify(row),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async select(table, query, token) {
    const r = await fetch(`${this.url}/rest/v1/${table}?${query}`, {
      headers: this._h(token),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async selectAll(table, query, token) {
    const rows=[];
    // Keep paging even when the server caps a page below our requested limit.
    for (;;) {
      const page=await this.select(table, `${query}&limit=500&offset=${rows.length}`, token);
      if (!Array.isArray(page)) throw new Error('資料格式錯誤');
      if (!page.length) return rows;
      rows.push(...page);
    }
  }
  async remove(table, id, token) {
    const r = await fetch(`${this.url}/rest/v1/${table}?id=eq.${id}`, {
      method: 'DELETE',
      headers: this._h(token),
    });
    if (!r.ok) throw new Error(await r.text());
  }
}

// ===== local storage =====
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.error(e); } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ===== utils =====
const getISOWeek = (date) => {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const w = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(w).padStart(2, '0')}`;
};

const downloadCSV = (rows, filename) => {
  const headers = ['時間', '稽核者', '病房', '床號', '模式', '原值', '調整後', 'SpO2', 'COPD', 'HFNC', '前階段HFNC', '後階段HFNC', 'HFNC前總氣體流量', 'HFNC後總氣體流量', '未用氧', '符合標準', '不符合原因', '原因組別', '原因說明', '註記'];
  const escape = (v) => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return `"${s.replace(/"/g, '""')}"`;
    }
    return s;
  };
  const lines = [headers.join(',')];
  rows.forEach(r => {
    const rs = r.noncompliance_reason ? REASON_MAP[r.noncompliance_reason] : null;
    lines.push([
      new Date(r.created_at).toLocaleString('zh-TW', { hour12: false }),
      r.auditor_name,
      r.ward,
      r.bed_number,
      r.mode === 'flow' ? '流量(L/min)' : 'FiO2(%)',
      r.original_value,
      r.adjusted_value,
      r.spo2 == null ? '' : r.spo2,
      r.copd ? '是' : '否',
      r.is_hfnc == null ? '未確認' : r.is_hfnc ? '是' : '否',
      r.hfnc_before == null ? '依標記或註記' : r.hfnc_before ? '是' : '否',
      r.hfnc_after == null ? '依標記或註記' : r.hfnc_after ? '是' : '否',
      r.hfnc_total_flow_before ?? '', r.hfnc_total_flow_after ?? '',
      isRoomAir(r) ? '是' : '否',
      r.compliant ? '符合' : '不符合',
      rs ? rs.label : '',
      rs ? GROUP_LABELS[rs.group] : '',
      r.reason_note || '',
      r.note || '',
    ].map(escape).join(','));
  });
  const bom = '\uFEFF';
  const blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

function App() {
  const [cfg, setCfg] = useState(null);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [booting, setBooting] = useState(true);

  useEffect(() => {
    // 如果 HTML 裡有寫死 Supabase 設定，直接使用
    if (EMBEDDED_SUPABASE_URL && EMBEDDED_SUPABASE_ANON_KEY) {
      setCfg({ url: EMBEDDED_SUPABASE_URL, anonKey: EMBEDDED_SUPABASE_ANON_KEY });
    } else {
      setCfg(store.get(CFG_KEY));
    }
    setSession(store.get(SES_KEY));
    setProfile(store.get(PRF_KEY));
    setBooting(false);
  }, []);

  const sb = useMemo(() => (cfg ? new SB(cfg.url, cfg.anonKey) : null), [cfg]);

  // 每次打開 App（已登入狀態）都靜默向 Supabase 重新確認最新的 profile
  // 避免改名字後，使用者手機還顯示舊的快取名稱
  useEffect(() => {
    if (!booting && sb && session && profile) {
      sb.select('profiles', `id=eq.${session.user.id}&select=*`, session.access_token)
        .then(found => {
          if (found[0] && JSON.stringify(found[0]) !== JSON.stringify(profile)) {
            store.set(PRF_KEY, found[0]);
            setProfile(found[0]);
          }
        })
        .catch(() => {}); // 靜默失敗，不影響使用
    }
  }, [booting, sb, session]);

  const apiCall = useCallback(async (fn) => {
    if (!session) throw new Error('未登入');
    try {
      return await fn(session.access_token);
    } catch (e) {
      const msg = String(e.message);
      if (msg.match(/JWT|expired|401|invalid/i)) {
        try {
          const ns = await sb.refresh(session.refresh_token);
          const merged = { ...session, ...ns };
          setSession(merged);
          store.set(SES_KEY, merged);
          return await fn(merged.access_token);
        } catch {
          store.del(SES_KEY); setSession(null);
          throw new Error('連線階段已過期，請重新登入');
        }
      }
      throw e;
    }
  }, [session, sb]);

  // 載入或建立 profile
  const loadOrCreateProfile = useCallback(async (sessionData, displayName) => {
    const token = sessionData.access_token;
    const uid = sessionData.user.id;
    // 先試著讀 profile
    const found = await sb.select('profiles', `id=eq.${uid}&select=*`, token);
    if (found.length > 0) {
      const p = found[0];
      store.set(PRF_KEY, p);
      setProfile(p);
      return p;
    }
    if (!displayName) return null;
    // 建立
    const created = await sb.insert('profiles', { id: uid, name: displayName, is_admin: false }, token);
    const p = created[0];
    store.set(PRF_KEY, p);
    setProfile(p);
    return p;
  }, [sb]);

  const handleLogin = async (sessionData) => {
    store.set(SES_KEY, sessionData);
    // 先載入 profile（若已存在）再設定 session，避免閃過「顯示名稱」畫面
    try {
      await loadOrCreateProfile(sessionData);
    } catch (e) {
      console.error('Load profile failed', e);
    }
    setSession(sessionData);
  };

  const handleProfileCreate = async (name) => {
    if (!session) return;
    try {
      await loadOrCreateProfile(session, name);
    } catch (e) {
      alert('建立 profile 失敗：' + e.message);
    }
  };

  const handleSignOut = () => {
    store.del(SES_KEY); store.del(PRF_KEY);
    setSession(null); setProfile(null);
  };

  const handleProfileUpdate = (newProfile) => {
    store.set(PRF_KEY, newProfile);
    setProfile(newProfile);
  };

  const resetConfig = () => {
    if (!confirm('重設後需要重新填 Supabase 設定，確定？')) return;
    store.del(CFG_KEY); store.del(SES_KEY); store.del(PRF_KEY);
    setCfg(null); setSession(null); setProfile(null);
  };

  if (booting) return <div className="text-center text-stone-400 py-20">載入中…</div>;
  if (!cfg) return <ConfigScreen onSave={(c) => { store.set(CFG_KEY, c); setCfg(c); }} />;
  if (!session) return <LoginScreen sb={sb} onLogin={handleLogin} onResetConfig={resetConfig} />;
  if (!profile) return <ProfileScreen email={session.user?.email} onSave={handleProfileCreate} onSignOut={handleSignOut} />;

  return <MainApp sb={sb} session={session} profile={profile} cfg={cfg} apiCall={apiCall} onSignOut={handleSignOut} onProfileUpdate={handleProfileUpdate} />;
}

      <p className="text-sm text-stone-500 mt-1">氧氣稽核稽核員專用</p>
      <div className="mt-8 space-y-3">
        <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="email" autoComplete="email"
          className="w-full bg-white border border-stone-300 rounded-lg px-3 py-3 text-base outline-none focus:border-teal-600" />
        <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} placeholder="密碼" autoComplete="current-password"
          onKeyDown={e => e.key === 'Enter' && submit()}

        {err && <div className="text-rose-600 text-sm">{err}</div>}
        <button onClick={submit} disabled={busy}
          className="w-full py-3.5 rounded-xl bg-stone-900 text-white font-semibold active:bg-stone-700 disabled:opacity-50">
          {busy ? '登入中…' : '登入'}
        </button>
        <p className="text-xs text-stone-400 leading-relaxed pt-2">

        <p className="text-xs text-stone-400">developer 林鎮均</p>

      </div>

// =====================================================================
function MainApp({ sb, session, profile, cfg, apiCall, onSignOut, onProfileUpdate }) {
  const [tab, setTab] = useState('entry');
  const [editing, setEditing] = useState(null);
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState('');
  const [recordsError, setRecordsError] = useState('');
  const [carbonSettings, setCarbonSettings] = useState([]);
  const [carbonLoading, setCarbonLoading] = useState(true);
  const [carbonError, setCarbonError] = useState('');


  const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 1800); };

  const confirmSignOut = () => {
    if (confirm('確定要登出？')) onSignOut();
  };

  const loadRecords = useCallback(async () => {
    setLoading(true);
    setRecordsError('');
    try {
      const data = await apiCall(t => sb.selectAll('oxygen_audits', 'select=*&order=created_at.desc,id.desc', t));
      setRecords(data);
    } catch (e) {
      setRecordsError('稽核資料未完整載入，請重新讀取。');
      showToast('讀取失敗：' + e.message);
    } finally { setLoading(false); }
  }, [apiCall, sb]);

  useEffect(() => { loadRecords(); }, [loadRecords]);

  const loadCarbonSettings = useCallback(async () => {
    setCarbonLoading(true);setCarbonError('');
    try {const data=await apiCall(t=>sb.selectAll('oxygen_carbon_parameters','select=*&order=ward.asc,effective_date.asc,id.asc',t));setCarbonSettings(data);}
    catch(e){setCarbonError('病房參數未能讀取，請確認已執行 v3.0 資料庫升級。');}
    finally{setCarbonLoading(false);}
  },[sb,apiCall]);
  useEffect(()=>{loadCarbonSettings();},[loadCarbonSettings]);
  const saveCarbonSettings = async (payload) => {
    if(!profile.is_admin)throw new Error('只有管理員可以設定參數');
    const rows=await apiCall(t=>sb.insert('oxygen_carbon_parameters',payload,t));
    if(rows.length!==1)throw new Error('參數儲存失敗');
    setCarbonSettings(prev=>[...prev,rows[0]]);
  };
  const retryCarbon = () => {loadRecords();loadCarbonSettings();};

  const addRecord = async (payload) => {
    const inserted = await apiCall(t => sb.insert('oxygen_audits', payload, t));
    setRecords(prev => [inserted[0], ...prev]);
    showToast('已儲存 ✓');
  };

  const updateRecord = async (payload) => {
    if (!profile.is_admin || !editing) throw new Error('只有管理員可以修改記錄');
    // 僅更新表單欄位，保留原始稽核者與建立時間。
    const { auditor_id, auditor_name, ...patch } = payload;
    const updated = await apiCall(t => sb.update('oxygen_audits', `id=eq.${editing.id}`, patch, t));
    if (updated.length !== 1) throw new Error('記錄不存在或沒有修改權限，請重新整理並確認已套用管理員編輯 SQL');
    setRecords(prev => prev.map(r => r.id === editing.id ? updated[0] : r));
    setEditing(null);
    showToast('已更新記錄 ✓');
  };

  const delRecord = async (id) => {
    if (!confirm('刪除這筆記錄？')) return;
    try {
      await apiCall(t => sb.remove('oxygen_audits', id, t));
      setRecords(prev => prev.filter(r => r.id !== id));
      showToast('已刪除');
    } catch (e) {
      showToast('刪除失敗：' + e.message);
    }
  };

  const thisWeekKey = getISOWeek(new Date());
  const weeklyStats = useMemo(() => {
    const map = {};
    records.forEach(r => {
      const k = getISOWeek(new Date(r.created_at));
      if (!map[k]) map[k] = { week: k, total: 0, ok: 0 };
      map[k].total++;
      if (r.compliant) map[k].ok++;
    });
    return Object.values(map).sort((a, b) => a.week.localeCompare(b.week))
      .map(w => ({ ...w, rate: w.total ? Math.round((w.ok / w.total) * 100) : 0 }));
  }, [records]);

  const thisWeek = weeklyStats.find(w => w.week === thisWeekKey) || { rate: 0, total: 0, ok: 0 };

  return (
    <div className="min-h-screen">
      <header className="px-5 pt-6 pb-4 bg-white border-b border-stone-200">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <span className="text-teal-700 flex-none"><O2Mark size={30} /></span>
            <div>
              <h1 className="text-xl font-bold tracking-tight serif">氧氣稽核</h1>
              <p className="text-[11px] text-stone-500 mt-0.5">
                {profile.name}{profile.is_admin ? ' · 管理員' : ''}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="text-right">
              <div className="text-3xl font-bold tabular-nums text-teal-700 serif">
                {thisWeek.rate}<span className="text-base text-stone-400">%</span>
              </div>
              <div className="text-[10px] text-stone-500 uppercase tracking-wider">本週符合率</div>
            </div>
            <button onClick={onSignOut} title="登出" aria-label="登出"
              className="p-2 rounded-lg text-stone-400 hover:text-rose-600 active:bg-stone-100">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <nav className="flex border-b border-stone-200 bg-white sticky top-0 z-10">
        {[
          { k: 'entry', label: '新增' },
          { k: 'stats', label: '統計' },
          { k: 'list', label: '記錄' },
          { k: 'settings', label: '設定' },
        ].map(t => (
          <button key={t.k} onClick={() => { setEditing(null); setTab(t.k); }}
            className={`flex-1 py-3 text-sm font-medium ${tab === t.k ? 'text-teal-700 border-b-2 border-teal-600' : 'text-stone-400'}`}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className={`px-5 py-5 pb-24 mx-auto ${tab === 'stats' ? 'max-w-3xl' : 'max-w-md'}`}>
        {tab === 'entry' && <EntryForm onSave={addRecord} session={session} profile={profile} showToast={showToast} />}
        {tab === 'stats' && <StatsView loading={loading} records={records} carbonContent={<CarbonDashboard records={records} settings={carbonSettings} loading={carbonLoading} error={carbonError} recordsLoading={loading} recordsError={recordsError} onRetry={retryCarbon} />} />}
        {tab === 'list' && editing && profile.is_admin && (
          <div className="space-y-4">
            <h2 className="text-lg font-semibold">修改稽核記錄</h2>
            <p className="text-xs text-stone-500">原稽核者：{editing.auditor_name} · {new Date(editing.created_at).toLocaleString('zh-TW', { hour12: false })}</p>
            <EntryForm key={editing.id} initialRecord={editing} onSave={updateRecord} onCancel={() => setEditing(null)} session={session} profile={profile} showToast={showToast} />
          </div>
        )}
        {tab === 'list' && !editing && <ListView loading={loading} records={records} session={session} profile={profile} onDelete={delRecord} onEdit={setEditing} onRefresh={loadRecords} />}
        {tab === 'settings' && profile.is_admin && <div className="mb-5"><CarbonSettings settings={carbonSettings} loading={carbonLoading} error={carbonError} onSave={saveCarbonSettings} onRetry={loadCarbonSettings} /></div>}
        {tab === 'settings' && <SettingsView carbonExport={<CarbonMonthlyExport records={records} settings={carbonSettings} loading={carbonLoading} error={carbonError} recordsLoading={loading} recordsError={recordsError} onRetry={retryCarbon} />} session={session} profile={profile} records={records} cfg={cfg} sb={sb} apiCall={apiCall} onSignOut={confirmSignOut} onProfileUpdate={onProfileUpdate} />}
      </main>

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm px-5 py-2.5 rounded-full shadow-lg z-50">
          {toast}
        </div>
      )}
    </div>
  );
}

// =====================================================================
function EntryForm({ onSave, session, profile, showToast, initialRecord = null, onCancel }) {
  const [ward, setWard] = useState(initialRecord?.ward ?? WARDS[0]);
  const [bed, setBed] = useState(initialRecord?.bed_number ?? '');
  const [mode, setMode] = useState(initialRecord?.mode ?? 'flow');
  const [original, setOriginal] = useState(initialRecord ? String(initialRecord.original_value) : '');
  const [adjusted, setAdjusted] = useState(initialRecord ? String(initialRecord.adjusted_value) : '');
  const [spo2, setSpo2] = useState(initialRecord?.spo2 != null ? String(initialRecord.spo2) : '');
  const [copd, setCopd] = useState(initialRecord?.copd ?? false);
  const [hfnc, setHfnc] = useState(initialRecord ? (typeof initialRecord.hfnc_before === 'boolean' && typeof initialRecord.hfnc_after === 'boolean' ? (initialRecord.hfnc_before ? (initialRecord.hfnc_after ? 'yes' : 'before') : (initialRecord.hfnc_after ? 'after' : 'no')) : initialRecord.is_hfnc === true ? 'yes' : initialRecord.is_hfnc === false ? 'no' : 'unknown') : 'no');
  const [hfncTotalBefore,setHfncTotalBefore] = useState(initialRecord?.hfnc_total_flow_before ?? '');
  const [hfncTotalAfter,setHfncTotalAfter] = useState(initialRecord?.hfnc_total_flow_after ?? '');
  const hfncBefore = hfnc === 'yes' || hfnc === 'before';
  const hfncAfter = hfnc === 'yes' || hfnc === 'after';
  const [manualOk, setManualOk] = useState(initialRecord?.compliant ?? null);
  const [reason, setReason] = useState(initialRecord?.noncompliance_reason ?? '');
  const [reasonNote, setReasonNote] = useState(initialRecord?.reason_note ?? '');
  const [note, setNote] = useState(initialRecord?.note ?? '');
  const [saving, setSaving] = useState(false);

  // 室內空氣（未用氧）：流量 0 L/min，或 FiO₂ ≤ 21%
  const roomAir = useMemo(() => {
    if (original === '') return false;
    const v = parseFloat(original);
    if (isNaN(v)) return false;
    return mode === 'flow' ? v === 0 : v <= 21;
  }, [original, mode]);

  const auto = useMemo(() => {
    if (spo2 === '') return null;
    const s = parseFloat(spo2);
    if (isNaN(s)) return null;
    const upper = copd ? 92 : 96, lower = copd ? 88 : 92;
    // 未用氧：沒有氧氣可降，SpO2 偏高是生理現象，不算不符合。
    // 但若低於下限＝有低血氧卻未給氧，仍判定為不符合。
    if (roomAir) return s >= lower;
    // 有用氧：SpO2 在目標範圍內 = 符合；超出範圍（過高或過低）= 不符合
    return s >= lower && s <= upper;
  }, [spo2, copd, roomAir]);

  const compliant = manualOk !== null ? manualOk : auto;
  const unit = mode === 'flow' ? 'L/min' : '%';

  // 原因分類已啟用？（2026-08-03 起）
  const reasonActive = isAfterGate(initialRecord?.created_at ?? new Date());

  // 一旦不是「不符合」，清掉已選的原因，避免誤存
  useEffect(() => {
    if (compliant !== false) { setReason(''); setReasonNote(''); }
  }, [compliant]);

  const reset = () => {
    setBed(''); setOriginal(''); setAdjusted(''); setSpo2('');
    setManualOk(null); setCopd(false); setHfnc('no'); setHfncTotalBefore(''); setHfncTotalAfter(''); setNote('');
    setReason(''); setReasonNote('');
  };

  const submit = async () => {
    if (!bed.trim()) { showToast('請輸入床號'); return; }
    if (bed.trim().length > 6) { showToast('床號最多 6 字元'); return; }
    if (original === '' || adjusted === '') { showToast('請輸入原值與調整後'); return; }
    const values = [Number(original), Number(adjusted)];
    if (values.some(v => !Number.isFinite(v) || v < 0 || (mode === 'fio2' && v > 100))) {
      showToast('請輸入有效的給氧數值（FiO₂ 為 0–100）'); return;
    }
    if (spo2 !== '' && (!Number.isFinite(Number(spo2)) || Number(spo2) < 0 || Number(spo2) > 100)) {
      showToast('SpO₂ 必須介於 0–100'); return;
    }
    if (HFNC_MARKING_VISIBLE && (hfncBefore || hfncAfter)) {
      if (mode !== 'fio2') { showToast('HFNC 請選 FiO₂ % 模式，輸入原始百分比'); return; }
      const checks=[hfncBefore && C.hfncFlow(original,hfncTotalBefore),hfncAfter && C.hfncFlow(adjusted,hfncTotalAfter)].filter(Boolean);
      const invalid=checks.find(c=>c.error);
      if(invalid){showToast(invalid.error);return;}
    }
    if (compliant === null) { showToast('請判定是否符合標準'); return; }
    if (compliant === false && reasonActive) {
      if (!reason) { showToast('請選擇不符合原因'); return; }
      if (reason === 'other' && !reasonNote.trim()) { showToast('選「其他」時請填寫說明'); return; }
    }
    setSaving(true);
    try {
      await onSave({
        auditor_id: session.user.id,
        auditor_name: profile.name,
        ward,
        bed_number: bed.trim(),
        mode,
        original_value: parseFloat(original),
        adjusted_value: parseFloat(adjusted),
        spo2: spo2 === '' ? null : parseFloat(spo2),
        copd,
        // Hidden controls must not overwrite existing metadata or mark new audits as non-HFNC.
        ...(HFNC_MARKING_VISIBLE ? {
        is_hfnc: hfnc === 'unknown' ? null : hfncBefore || hfncAfter,
        hfnc_before: hfnc === 'unknown' ? null : hfncBefore,
        hfnc_after: hfnc === 'unknown' ? null : hfncAfter,
        hfnc_total_flow_before: hfncBefore && hfncTotalBefore !== '' ? Number(hfncTotalBefore) : null,
        hfnc_total_flow_after: hfncAfter && hfncTotalAfter !== '' ? Number(hfncTotalAfter) : null,
        } : {}),
        compliant: compliant === true,
        noncompliance_reason: compliant === false && reason ? reason : null,
        reason_note: compliant === false && reasonNote.trim() ? reasonNote.trim() : null,
        note: note.trim() || null,
      });
      if (!initialRecord) reset();
    } catch (e) {
      showToast('儲存失敗：' + e.message);
    } finally { setSaving(false); }
  };

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">病房 <span className="text-rose-500">*</span></label>
          <select value={ward} onChange={e => setWard(e.target.value)}
            className="mt-1 w-full text-lg font-semibold bg-white border border-stone-300 rounded-lg px-3 py-3 outline-none focus:border-teal-600">
            {WARDS.map(w => <option key={w} value={w}>{w}</option>)}
          </select>
        </div>
        <div>
          <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">床號 <span className="text-rose-500">*</span></label>
          <input value={bed} onChange={e => setBed(e.target.value.slice(0, 6))} maxLength={6} inputMode="numeric"
            placeholder="0000"
            className="mt-1 w-full text-lg font-semibold bg-white border border-stone-300 rounded-lg px-3 py-3 outline-none focus:border-teal-600" />
        </div>
      </div>

      <div>
        <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">給氧模式</label>
        <div className="mt-1 grid grid-cols-2 gap-2">
          <button onClick={() => setMode('flow')}
            className={`py-3 rounded-lg border-2 text-sm font-semibold ${mode === 'flow' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-stone-200 bg-white text-stone-500'}`}>
            流量 L/min
          </button>
          <button onClick={() => setMode('fio2')}
            className={`py-3 rounded-lg border-2 text-sm font-semibold ${mode === 'fio2' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-stone-200 bg-white text-stone-500'}`}>
            FiO₂ %
          </button>
        </div>
      </div>

      {HFNC_MARKING_VISIBLE && <>
      <label className="block text-xs text-stone-600">HFNC（高流量鼻導管）
        <select aria-label="HFNC 狀態" value={hfnc} onChange={e=>setHfnc(e.target.value)} className="mt-1 w-full bg-white border border-stone-300 rounded-lg px-3 py-2.5 text-sm">
          <option value="no">否：一般給氧</option><option value="yes">調整前後皆為 HFNC</option><option value="before">僅調整前為 HFNC</option><option value="after">僅調整後為 HFNC</option><option value="unknown">未標記：依註記辨識 HFNC</option>
        </select>
        <span className="block text-stone-500 mt-1">只影響流量與估算減碳分析，不改變原始符合判定。請依調整前後的實際裝置選擇階段；FiO₂ 保留原始百分比。</span>
      </label>
      {(hfncBefore || hfncAfter) && <div className="bg-teal-50 border border-teal-200 rounded-xl p-3 text-xs text-teal-900 space-y-2">
        <p>HFNC 總氣體流量統一假設為 50 L/min，純氧消耗量為估算值。</p>
        <div className="grid grid-cols-2 gap-2">
          {hfncBefore && <label>調整前實際總氣體流量（L/min，選填）<input aria-label="HFNC 調整前實際總氣體流量" type="number" step="any" value={hfncTotalBefore} onChange={e=>setHfncTotalBefore(e.target.value)} placeholder="未填則採用 50" className="mt-1 w-full border border-teal-200 rounded-lg px-2 py-2 bg-white" /></label>}
          {hfncAfter && <label>調整後實際總氣體流量（L/min，選填）<input aria-label="HFNC 調整後實際總氣體流量" type="number" step="any" value={hfncTotalAfter} onChange={e=>setHfncTotalAfter(e.target.value)} placeholder="未填則採用 50" className="mt-1 w-full border border-teal-200 rounded-lg px-2 py-2 bg-white" /></label>}
        </div>
        {mode==='fio2' && <p>估算純氧：{carbonFmt((hfncBefore?C.hfncFlow(original,hfncTotalBefore):C.flow(mode,original)).value??null)} → {carbonFmt((hfncAfter?C.hfncFlow(adjusted,hfncTotalAfter):C.flow(mode,adjusted)).value??null)} L/min（實際值優先）</p>}
      </div>}
      </>}
      <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-end">
        <div>
          <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">原值</label>
          <div className="mt-1 relative">
            <input type="number" inputMode="decimal" step="0.5" value={original} onChange={e => setOriginal(e.target.value)}
              className="w-full text-2xl font-semibold tabular-nums bg-white border border-stone-300 rounded-lg px-3 py-3 pr-12 outline-none focus:border-teal-600" />
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-stone-400">{unit}</span>
          </div>
        </div>
        <div className="pb-3 text-stone-400 text-2xl">→</div>
        <div>
          <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">調整後</label>
          <div className="mt-1 relative">
            <input type="number" inputMode="decimal" step="0.5" value={adjusted} onChange={e => setAdjusted(e.target.value)}
              className="w-full text-2xl font-semibold tabular-nums bg-white border border-stone-300 rounded-lg px-3 py-3 pr-12 outline-none focus:border-teal-600" />
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-stone-400">{unit}</span>
          </div>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-stone-200 p-4">
        <div className="flex items-center justify-between mb-2">
          <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">調整前的 SpO₂</label>
          <label className="flex items-center gap-1.5 text-xs text-stone-600">
            <input type="checkbox" checked={copd} onChange={e => setCopd(e.target.checked)} className="accent-teal-600" />
            COPD
          </label>
        </div>
        {roomAir && (

// 依期間類型計算起始時間點（本地時區）
const getPeriodStart = (period) => {
  const now = new Date();
  if (period === 'thisWeek') {
    const day = now.getDay() || 7; // 週一=1...週日=7
    const d = new Date(now);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - (day - 1));
    return d;
  }
  if (period === 'thisMonth') return new Date(now.getFullYear(), now.getMonth(), 1);
  if (period === 'thisQuarter') {
    const qMonth = Math.floor(now.getMonth() / 3) * 3;
    return new Date(now.getFullYear(), qMonth, 1);
  }
  if (period === 'thisYear') return new Date(now.getFullYear(), 0, 1);
  return null; // all
};

const PERIOD_LABELS = { thisWeek: '本週', thisMonth: '本月', thisQuarter: '本季', thisYear: '本年', all: '全部' };

function StatsView({ loading, records, carbonContent }) {
  const [period, setPeriod] = useState('thisWeek');
  const label = PERIOD_LABELS[period];

  const periodRecords = useMemo(() => {
    const start = getPeriodStart(period);
    if (!start) return records;
    return records.filter(r => new Date(r.created_at) >= start);
  }, [records, period]);

  const overall = useMemo(() => {
    if (!periodRecords.length) return { total: 0, ok: 0, rate: 0 };
    const ok = periodRecords.filter(r => r.compliant).length;
    return { total: periodRecords.length, ok, rate: Math.round((ok / periodRecords.length) * 100) };
  }, [periodRecords]);

  const wardStats = useMemo(() => WARDS.map(w => {
    const wr = periodRecords.filter(r => r.ward === w);
    const ok = wr.filter(r => r.compliant).length;
    return { ward: w, total: wr.length, ok, rate: wr.length ? Math.round((ok / wr.length) * 100) : 0 };
  }), [periodRecords]);

  const weeklyStats = useMemo(() => {
    const map = {};
    periodRecords.forEach(r => {
      const k = getISOWeek(new Date(r.created_at));
      if (!map[k]) map[k] = { week: k, total: 0, ok: 0 };
      map[k].total++;
      if (r.compliant) map[k].ok++;
    });
    return Object.values(map).sort((a, b) => a.week.localeCompare(b.week))
      .map(w => ({ ...w, rate: w.total ? Math.round((w.ok / w.total) * 100) : 0 }));
  }, [periodRecords]);

  // 趨勢圖固定顯示全部期間，不受上方週／月／季選擇影響，
  // 以便隨時看到長期走勢（選「本週」時若跟著篩選只會剩一個點）。
  const allWeeklyStats = useMemo(() => {
    const map = {};
    records.forEach(r => {
      const k = getISOWeek(new Date(r.created_at));
      if (!map[k]) map[k] = { week: k, total: 0, ok: 0 };
      map[k].total++;
      if (r.compliant) map[k].ok++;
    });
    return Object.values(map).sort((a, b) => a.week.localeCompare(b.week))
      .map(w => ({ ...w, rate: w.total ? Math.round((w.ok / w.total) * 100) : 0 }));
  }, [records]);

  // ===== 原因分析（只計 REASON_START_DATE 之後的紀錄）=====
  const reasonAnalysis = useMemo(() => {
    const gated = periodRecords.filter(r => isAfterGate(r.created_at));
    const nonComp = gated.filter(r => !r.compliant);
    const byReason = {};
    REASONS.forEach(r => { byReason[r.code] = 0; });
    let uncoded = 0;
    const groupCount = { actionable: 0, justified: 0, pending: 0 };
    nonComp.forEach(r => {
      const meta = r.noncompliance_reason ? REASON_MAP[r.noncompliance_reason] : null;
      if (!meta) { uncoded++; return; }
      byReason[meta.code]++;
      groupCount[meta.group]++;
    });
    return {
      base: gated.length,          // 分母：啟用後的全部稽核
      nonComp: nonComp.length,
      byReason, uncoded, groupCount,
      actionableRate: gated.length ? Math.round((groupCount.actionable / gated.length) * 100) : 0,
    };
  }, [periodRecords]);

  const ra = reasonAnalysis;

  return (
    <div className="space-y-5">
      <select value={period} onChange={e => setPeriod(e.target.value)}
        className="bg-white border border-stone-300 rounded-lg px-3 py-2 text-sm font-semibold">
        <option value="thisWeek">本週</option>
        <option value="thisMonth">本月</option>
        <option value="thisQuarter">本季</option>
        <option value="thisYear">本年</option>
        <option value="all">全部</option>
      </select>

      <div className="grid grid-cols-3 gap-3">
        <StatCard label={`${label}符合率`} value={`${overall.rate}%`} sub={`${overall.ok}/${overall.total}`} />
        <StatCard label={`${label}稽核筆數`} value={overall.total} sub="筆" />
        <StatCard label="不符合" value={overall.total - overall.ok} sub={`${label}件數`} />
      </div>

      {carbonContent}

      <div className="bg-white rounded-xl border border-stone-200 p-4">
        <div className="text-sm font-semibold text-stone-700 mb-3">每週符合率趨勢</div>
        {loading ? <div className="text-center text-stone-400 py-10 text-sm">載入中…</div>
          : allWeeklyStats.length === 0 ? <div className="text-center text-stone-400 py-10 text-sm">尚無資料</div>
            : <WeeklyChart data={allWeeklyStats} />}
      </div>

    </div>
  );
}

function WeeklyChart({ data }) {
  const W = 320, H = 200;
  const pad = { t: 18, r: 15, b: 28, l: 28 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;
  const x = (i) => pad.l + (data.length === 1 ? cw / 2 : (i / (data.length - 1)) * cw);
  const y = (v) => pad.t + ch - (v / 100) * ch;
  const linePath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(d.rate).toFixed(1)}`).join(' ');
  const labelStep = Math.max(1, Math.ceil(data.length / 6));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="每週符合率趨勢，以各週實際符合筆數除以稽核筆數計算">
      {[0, 25, 50, 75, 100].map(v => (
        <g key={v}>
          <line x1={pad.l} y1={y(v)} x2={W - pad.r} y2={y(v)} stroke="#e7e5e4" />
          <text x={pad.l - 4} y={y(v) + 3} fontSize="9" fill="#a8a29e" textAnchor="end">{v}</text>
        </g>
      ))}
      <path d={linePath} stroke="#0f766e" strokeWidth="2.5" fill="none" strokeLinejoin="round" />
      {data.map((d, i) => (
        <circle key={i} cx={x(i)} cy={y(d.rate)} r="3.5" fill="#0f766e"><title>{d.week}：{d.ok}/{d.total} 筆，符合率 {d.rate}%</title></circle>
      ))}
      {data.map((d, i) => (
        i % labelStep === 0 || i === data.length - 1 ? (
          <text key={i} x={x(i)} y={H - 8} fontSize="9" fill="#78716c" textAnchor="middle">
            W{d.week.split('-W')[1]}
          </text>
        ) : null
      ))}
    </svg>
  );
}

function ListView({ loading, records, session, profile, onDelete, onEdit, onRefresh }) {
  const [wardFilter, setWardFilter] = useState('all');
  const [periodFilter, setPeriodFilter] = useState('all');

  const filtered = useMemo(() => {
    const now = new Date();
    const thisWeekKey = getISOWeek(now);

    // 上週
    const lastWeekDate = new Date(now);
    lastWeekDate.setDate(lastWeekDate.getDate() - 7);
    const lastWeekKey = getISOWeek(lastWeekDate);

    // 本月起始
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

    // 本季起始（1/4/7/10 月）
    const quarterMonth = Math.floor(now.getMonth() / 3) * 3;
    const quarterStart = new Date(now.getFullYear(), quarterMonth, 1);

    let result = records;

    // 週別篩選
    if (periodFilter === 'thisWeek') {
      result = result.filter(r => getISOWeek(new Date(r.created_at)) === thisWeekKey);
    } else if (periodFilter === 'lastWeek') {
      result = result.filter(r => getISOWeek(new Date(r.created_at)) === lastWeekKey);
    } else if (periodFilter === 'thisMonth') {
      result = result.filter(r => new Date(r.created_at) >= monthStart);
    } else if (periodFilter === 'thisQuarter') {
      result = result.filter(r => new Date(r.created_at) >= quarterStart);
    }

    // 病房篩選
    if (wardFilter !== 'all') {
      result = result.filter(r => r.ward === wardFilter);
    }

    return result;
  }, [records, wardFilter, periodFilter]);

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 gap-2">
        <select value={wardFilter} onChange={e => setWardFilter(e.target.value)}
          className="bg-white border border-stone-200 rounded-lg px-3 py-1.5 text-xs">
          <option value="all">所有病房</option>
          {WARDS.map(w => <option key={w} value={w}>{w}</option>)}
        </select>
        <select value={periodFilter} onChange={e => setPeriodFilter(e.target.value)}
          className="bg-white border border-stone-200 rounded-lg px-3 py-1.5 text-xs">
          <option value="all">全部時間</option>
          <option value="thisWeek">本週</option>
          <option value="lastWeek">上週</option>
          <option value="thisMonth">本月</option>
          <option value="thisQuarter">本季</option>
        </select>
      </div>
      <div className="flex items-center justify-between">
        <span className="text-xs text-stone-400">共 {filtered.length} 筆</span>
        <button onClick={onRefresh} className="text-xs text-stone-500 px-3 py-1.5 border border-stone-200 rounded-lg bg-white">
          重新整理
        </button>
      </div>
      {loading ? <div className="text-center text-stone-400 py-10 text-sm">載入中…</div>
        : filtered.length === 0 ? <div className="text-center text-stone-400 py-10 text-sm">尚無記錄</div>
          : filtered.map(r => {
            const d = new Date(r.created_at);
            const rs = r.noncompliance_reason ? REASON_MAP[r.noncompliance_reason] : null;
            return (
              <div key={r.id} className="bg-white rounded-lg border border-stone-200 p-3">
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-[10px] bg-stone-200 text-stone-700 px-1.5 py-0.5 rounded font-semibold">{r.ward}</span>
                    <span className="text-lg font-bold tabular-nums">{r.bed_number}</span>
                    <span className={`text-[10px] px-1.5 py-0.5 rounded ${r.compliant ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                      {r.compliant ? '符合' : '不符合'}
                    </span>
                    {HFNC_MARKING_VISIBLE && r.is_hfnc == null && <span className="text-[10px] bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded">HFNC 未標記</span>}
                    {HFNC_MARKING_VISIBLE && r.is_hfnc === true && <span className="text-[10px] bg-stone-100 text-stone-600 px-1.5 py-0.5 rounded">HFNC</span>}
                    {isRoomAir(r) && (
                      <span className="text-[10px] px-1.5 py-0.5 rounded bg-teal-50 text-teal-700 border border-teal-200">未用氧</span>
                    )}
                    {rs && (
                      <span className={`text-[10px] px-1.5 py-0.5 rounded border ${rs.group === 'actionable' ? 'border-rose-200 text-rose-700' : rs.group === 'justified' ? 'border-emerald-200 text-emerald-700' : 'border-stone-300 text-stone-500'}`}>
                        {rs.label}

                    )}

                  {profile.is_admin && <div className="flex gap-3 flex-none ml-2">
                    <button onClick={() => onEdit(r)} className="text-teal-700 text-xs">修改</button>
                    <button onClick={() => onDelete(r.id)} className="text-stone-400 text-xs hover:text-rose-600">刪除</button>
                  </div>}
                </div>
                <div className="mt-1 text-sm tabular-nums text-stone-700">
                  {r.original_value} → {r.adjusted_value} {r.mode === 'flow' ? 'L/min' : '%'}

                </div>
                {r.reason_note && (
                  <div className="mt-1 text-xs text-stone-600 bg-rose-50 rounded px-2 py-1.5 leading-relaxed">

  );

function ChangeNameCard({ profile, sb, apiCall, onSuccess }) {
  const [name, setName] = useState(profile.name);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');

  const submit = async () => {
    setMsg(''); setErr('');
    if (!name.trim()) { setErr('名稱不能空白'); return; }
    if (name.trim() === profile.name) return;
    setBusy(true);
    try {
      const updated = await apiCall(t => sb.update('profiles', `id=eq.${profile.id}`, { name: name.trim() }, t));
      if (updated[0]) onSuccess(updated[0]);
      setMsg('已更新');
      setTimeout(() => setMsg(''), 2000);
    } catch (e) {
      setErr('更新失敗：' + e.message);
    } finally { setBusy(false); }
  };

  return (
    <div className="bg-white rounded-xl border border-stone-200 p-4 space-y-3">
      <div className="text-sm font-semibold text-stone-700">變更顯示名稱</div>
      <input value={name} onChange={e => setName(e.target.value)}
        className="w-full bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-teal-600" />
      {err && <div className="text-rose-600 text-sm">{err}</div>}
      {msg && <div className="text-emerald-700 text-sm">{msg}</div>}
      <button onClick={submit} disabled={busy || name.trim() === profile.name || !name.trim()}
        className="w-full py-2.5 rounded-lg bg-stone-900 text-white text-sm font-semibold active:bg-stone-700 disabled:opacity-40">
        {busy ? '更新中…' : '更新名稱'}
      </button>
    </div>
  );
}

function ChangePasswordCard({ sb, session }) {
  const [pwd1, setPwd1] = useState('');
  const [pwd2, setPwd2] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');

  const submit = async () => {
    setMsg(''); setErr('');
    if (pwd1.length < 6) { setErr('密碼至少 6 字元'); return; }
    if (pwd1 !== pwd2) { setErr('兩次密碼不一致'); return; }
    setBusy(true);
    try {
      await sb.updateOwnPassword(pwd1, session.access_token);
      setMsg('密碼已更新');
      setPwd1(''); setPwd2('');
      setTimeout(() => setMsg(''), 2500);
    } catch (e) {
      setErr(e.message);
    } finally { setBusy(false); }
  };

  return (
    <div className="bg-white rounded-xl border border-stone-200 p-4 space-y-3">
      <div className="text-sm font-semibold text-stone-700">變更密碼</div>

function UserManagementCard({ session, sb, apiCall, cfg }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [editName, setEditName] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const data = await apiCall(t => sb.select('profiles', 'select=*&order=created_at.asc', t));
      setUsers(data);
    } catch (e) {
      alert('讀取失敗：' + e.message);
    } finally { setLoading(false); }
  }, [apiCall, sb]);

  useEffect(() => { load(); }, [load]);

  const startEdit = (u) => { setEditing(u.id); setEditName(u.name); };

  const saveEdit = async () => {
    if (!editName.trim()) { alert('名稱不能空白'); return; }
    try {
      await apiCall(t => sb.update('profiles', `id=eq.${editing}`, { name: editName.trim() }, t));
      setUsers(prev => prev.map(x => x.id === editing ? { ...x, name: editName.trim() } : x));
      setEditing(null);
    } catch (e) {
      alert('儲存失敗：' + e.message);
    }
  };

  const toggleAdmin = async (u) => {
    const newVal = !u.is_admin;
    if (u.id === session.user.id && !newVal) {
      const others = users.filter(x => x.id !== u.id && x.is_admin);
      if (others.length === 0) {
        alert('不能取消最後一位管理員的權限，請先指派其他管理員');
        return;
      }
      if (!confirm('要取消自己的管理員權限嗎？取消後將失去管理功能。')) return;
    } else {
      const action = newVal ? '設為' : '取消';
      if (!confirm(`要${action}「${u.name}」的管理員權限嗎？`)) return;
    }
    try {
      await apiCall(t => sb.update('profiles', `id=eq.${u.id}`, { is_admin: newVal }, t));
      setUsers(prev => prev.map(x => x.id === u.id ? { ...x, is_admin: newVal } : x));
    } catch (e) {
      alert('變更失敗：' + e.message);
    }
  };

  // 解析 Supabase Dashboard 網址（從 project URL）
  const projectId = (cfg.url.match(/https:\/\/([^.]+)\./) || [])[1];
  const dashUrl = projectId ? `https://supabase.com/dashboard/project/${projectId}/auth/users` : null;

  return (
    <div className="bg-white rounded-xl border border-stone-200 p-4 space-y-3">
      <div className="flex items-center justify-between">
        <div className="text-sm font-semibold text-stone-700">使用者管理</div>
        <button onClick={load} className="text-xs text-stone-500">重新整理</button>
      </div>

      {loading ? <div className="text-stone-400 text-sm text-center py-4">載入中…</div>
        : (
          <div className="space-y-2">
            {users.map(u => (
              <div key={u.id} className="border border-stone-200 rounded-lg p-3">
                {editing === u.id ? (
                  <div className="space-y-2">
                    <input value={editName} onChange={e => setEditName(e.target.value)} autoFocus
                      className="w-full bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-600" />
                    <div className="flex gap-2">
                      <button onClick={saveEdit} className="flex-1 py-1.5 rounded bg-teal-700 text-white text-xs font-semibold">儲存</button>
                      <button onClick={() => setEditing(null)} className="flex-1 py-1.5 rounded border border-stone-300 text-stone-600 text-xs">取消</button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-semibold">{u.name}</span>
                        {u.is_admin && <span className="text-[10px] bg-teal-100 text-teal-800 px-1.5 py-0.5 rounded-full">管理員</span>}
                        {u.id === session.user.id && <span className="text-[10px] text-stone-400">（你）</span>}
                      </div>
                      <button onClick={() => startEdit(u)} className="text-xs text-stone-500 hover:text-stone-900">編輯</button>
                    </div>
                    <div className="mt-2 flex gap-2">
                      <button onClick={() => toggleAdmin(u)}
                        className={`text-xs px-2.5 py-1 rounded border ${u.is_admin ? 'border-rose-200 text-rose-700 hover:bg-rose-50' : 'border-teal-300 text-teal-700 hover:bg-teal-50'}`}>
                        {u.is_admin ? '取消管理員' : '設為管理員'}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

      <div className="pt-3 border-t border-stone-100 space-y-2">
        <div className="text-xs font-semibold text-stone-600">新增 / 刪除帳號 / 重設他人密碼</div>
        <p className="text-xs text-stone-500 leading-relaxed">
          這些操作需在 Supabase 後台執行（Authentication → Users）。新增使用者時務必勾選 <span className="font-mono bg-stone-100 px-1">Auto Confirm User</span>。
        </p>
        {dashUrl && (
          <a href={dashUrl} target="_blank" rel="noopener noreferrer"
            className="block text-center w-full py-2 rounded-lg bg-stone-100 text-stone-700 text-xs font-semibold hover:bg-stone-200">
            開啟 Supabase 使用者管理 ↗
          </a>
        )}
      </div>
    </div>
  );
}

function ExportCard({ records }) {
  const [exportWard, setExportWard] = useState('all');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');

  const doExport = () => {
    let rows = exportWard === 'all' ? records : records.filter(r => r.ward === exportWard);
    if (startDate) {
      const start = new Date(startDate + 'T00:00:00');
      rows = rows.filter(r => new Date(r.created_at) >= start);
    }
    if (endDate) {
      const end = new Date(endDate + 'T23:59:59');
      rows = rows.filter(r => new Date(r.created_at) <= end);
    }
    if (rows.length === 0) { alert('沒有可匯出的資料'); return; }
    const today = new Date().toISOString().slice(0, 10);
    const tag = exportWard === 'all' ? '全部' : exportWard;
    const rangeTag = (startDate || endDate) ? `_${startDate || '起'}~${endDate || '今'}` : '';
    downloadCSV(rows, `氧氣稽核_${today}_${tag}${rangeTag}.csv`);
  };
  return (
    <div className="bg-white rounded-xl border border-stone-200 p-4 space-y-3">
      <div className="text-sm font-semibold text-stone-700">匯出 CSV</div>
      <select value={exportWard} onChange={e => setExportWard(e.target.value)}
        className="w-full bg-white border border-stone-300 rounded-lg px-3 py-2.5 text-sm">

        {WARDS.map(w => <option key={w} value={w}>僅 {w}</option>)}
      </select>
      <div className="grid grid-cols-2 gap-2">
        <div>
          <label className="text-[11px] uppercase tracking-wider text-stone-500 font-semibold">起始日期</label>

        </div>

          <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)}

/* CARBON_UI_BEGIN */
const C = OxygenCarbon;
// Project scope is separate from audit wards: RCC historical data stays intact.
const CARBON_PROJECT_WARDS = ['5A'];
const carbonFmt = (n, digits=2) => n===null || !Number.isFinite(n) ? '資料不足' : n.toLocaleString('zh-TW', {minimumFractionDigits:digits,maximumFractionDigits:digits});
const carbonPanel = 'bg-white rounded-xl border border-stone-200 p-4';
const carbonInput = 'w-full bg-white border border-stone-300 rounded-lg px-3 py-2 text-sm';

function CarbonChart({ title, data, keys, labels, unit, bars=false }) {
  const values=data.flatMap(d=>keys.map(k=>d[k])).filter(v=>v!==null&&Number.isFinite(v));
  const W=340,H=205,p={l:48,r:16,t:20,b:38},cw=W-p.l-p.r,ch=H-p.t-p.b;
  const min=Math.min(0,...values),rawMax=Math.max(0,...values),max=rawMax===min?min+1:rawMax;
  const y=v=>p.t+(max-v)/(max-min)*ch;
  const x=i=>p.l+cw*(i+.5)/Math.max(1,data.length);
  const colors=['#0f766e','#a8a29e'];
  const step=Math.max(1,Math.ceil(data.length/4));
  return <section className={carbonPanel}>
    <h3 className="text-sm font-semibold text-stone-700">{title}</h3>
    <p className="text-xs text-stone-500 mt-1">{unit}</p>
    {!values.length ? <p className="text-center text-stone-400 py-10 text-sm">資料不足</p> : <>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full mt-2" role="img" aria-label={`${title}，單位 ${unit}；缺資料月份保留缺口`}>
        {[0,.5,1].map(f=>{const v=min+(max-min)*f;return <g key={f}><line x1={p.l} x2={W-p.r} y1={y(v)} y2={y(v)} stroke="#e7e5e4"/><text x={p.l-6} y={y(v)+4} textAnchor="end" fill="#78716c" fontSize="16">{v.toLocaleString('zh-TW',{notation:'compact',maximumFractionDigits:1})}</text></g>;})}
        {min<0&&max>0&&<line x1={p.l} x2={W-p.r} y1={y(0)} y2={y(0)} stroke="#a8a29e"/>}
        {keys.map((k,j)=>bars ? data.map((d,i)=>d[k]===null?null:<rect key={`${k}-${i}`} x={x(i)-Math.min(34,cw/data.length*.65)/2+j*Math.min(34,cw/data.length*.65)/keys.length} y={Math.min(y(0),y(d[k]))} width={Math.min(34,cw/data.length*.65)/keys.length-1} height={Math.abs(y(d[k])-y(0))} fill={colors[j]}><title>{d.month} {labels[j]}：{carbonFmt(d[k])} {unit}</title></rect>) : <g key={k}>
          <path fill="none" stroke={colors[j]} strokeWidth="2" d={data.map((d,i)=>d[k]===null?'':`${i===0||data[i-1][k]===null?'M':'L'} ${x(i)} ${y(d[k])}`).join(' ')}/>
          {data.map((d,i)=>d[k]===null?null:<circle key={i} cx={x(i)} cy={y(d[k])} r="3" fill={colors[j]}><title>{d.month} {labels[j]}：{carbonFmt(d[k])} {unit}</title></circle>)}
        </g>)}
        {data.map((d,i)=>(i%step===0||i===data.length-1)&&<text key={d.month} x={x(i)} y={H-16} textAnchor="middle" fill="#78716c" fontSize="16">{d.month.slice(2)}</text>)}
      </svg>
      {keys.length>1&&<div className="flex justify-center gap-4 text-xs text-stone-600">{labels.map((label,i)=><span key={label}><span className="inline-block w-2 h-2 rounded-sm mr-1" style={{background:colors[i]}}></span>{label}</span>)}</div>}
    </>}
  </section>;
}

function exportCarbonRows(rows, name) {
  const headers=['年月','病房','稽核總筆數','過度用氧盛行率(%)','盛行率無法判定筆數','有效流量統計筆數','調整前平均流量(L/min)','調整後平均流量(L/min)','平均淨調降量(L/min)','實際調降者平均調降量(L/min)','有效計算天數','估算氧氣節省量(m³)','估算減碳量(kg CO₂e)','累積估算氧氣節省量(m³)','累積估算減碳量(kg CO₂e)','累積資料狀態','HFNC未標記依註記納入筆數','HFNC有效估算筆數','HFNC採用50L/min假設筆數'];
  const value=v=>v===null?'資料不足':typeof v==='number'?String(v):String(v??'');
  const escape=v=>'"'+value(v).replace(/"/g,'""')+'"';
  const lines=rows.map(r=>[r.month,r.ward,r.total,r.prevalence===null?null:r.prevalence*100,r.unknownPrevalence,r.count,r.before,r.after,r.net,r.down,r.days,r.oxygen,r.carbon,r.cumulativeOxygen,r.cumulativeCarbon,r.incomplete?'資料不完整（已知月份小計）':'完整',r.unknownHFNC,r.hfnc,r.assumedHFNC].map(escape).join(','));
  const blob=new Blob(['\uFEFF'+[headers.map(escape).join(','),...lines].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function CarbonSettings({settings,loading,error,onSave,onRetry}) {
  const ward=CARBON_PROJECT_WARDS[0];
  const [draft,setDraft]=useState(null),[busy,setBusy]=useState(false),[message,setMessage]=useState('');
  const today=C.dateKey(new Date());
  const history=C.historyFor(settings,ward);
  const current=C.paramsAt(history,today);
  const fields=[['beds','病房床數','床'],['occupancy','占床率','%'],['oxygen_fraction','用氧比例','%'],['hours','每日調降維持時間','小時'],['carbon_kg_per_litre','氧氣碳排放係數','kg CO₂e/L'],['max_flow_lpm','流量資料分析上限','L/min']];
  const openDraft=()=>{setDraft({...C.DEFAULTS,...current,ward,effective_date:today});setMessage('');};
  const change=(key,value)=>setDraft(p=>({...p,[key]:value}));
  const save=async()=>{
    const payload={ward,effective_date:draft.effective_date,accumulation_start:draft.accumulation_start,source_note:draft.source_note.trim()};
    for(const [key]of fields)payload[key]=C.number(draft[key]);
    if(C.validateParams(payload).length){setMessage('請檢查參數、日期與來源說明；床數為正整數，占床率／用氧比例為 0–100%，維持時間 0–24 小時。');return;}
    if(history.some(p=>p.effective_date===payload.effective_date)){setMessage('此病房該生效日已有歷史版本，請選擇其他日期；歷史設定不覆寫。');return;}
    setBusy(true);setMessage('');
    try{await onSave(payload);setDraft(null);setMessage('已新增參數歷史版本，統計已重新計算。');}catch(e){setMessage('儲存失敗：'+e.message);}finally{setBusy(false);}
  };
  return <section className={carbonPanel+' space-y-3'}>
    <h2 className="text-sm font-semibold text-stone-700">氧氣節省與估算減碳參數</h2>
    {loading?<p className="text-sm text-stone-500">載入中…</p>:error?<div className="text-sm text-rose-700"><p>{error}</p><button onClick={onRetry} className="underline mt-2">重新讀取</button></div>:<>
      <p className="text-sm text-teal-800 font-semibold">5A 專案參數</p>
      <p className="text-xs text-stone-500">目前生效：{current?.effective_date||'尚未設定'}。新增版本保留舊設定；回溯生效會重新計算受影響月份。</p>
      {!draft?<button onClick={openDraft} className="w-full bg-teal-700 text-white rounded-lg py-2 text-sm">新增參數版本</button>:<fieldset disabled={busy} className="space-y-3">
        <div className="grid grid-cols-2 gap-3">{fields.map(([key,label,unit])=><label key={key} className="text-xs text-stone-600">{label}（{unit}）<input type="number" step={key==='beds'?'1':'any'} value={['occupancy','oxygen_fraction'].includes(key)?(draft[key]===''?'':Number(draft[key])*100):draft[key]} onChange={e=>change(key,e.target.value===''?'':['occupancy','oxygen_fraction'].includes(key)?Number(e.target.value)/100:e.target.value)} className={carbonInput+' mt-1'} /></label>)}</div>
        <label className="block text-xs text-stone-600">生效日期<input type="date" value={draft.effective_date} onChange={e=>change('effective_date',e.target.value)} className={carbonInput+' mt-1'} /></label>
        <label className="block text-xs text-stone-600">累積計算起始日<input type="date" value={draft.accumulation_start} onChange={e=>change('accumulation_start',e.target.value)} className={carbonInput+' mt-1'} /></label>
        <label className="block text-xs text-stone-600">係數來源與適用說明<textarea rows={5} value={draft.source_note} onChange={e=>change('source_note',e.target.value)} className={carbonInput+' mt-1'} /></label>
        <p className="text-xs text-stone-500">係數為暫定估算值。流量上限是資料檢核設定，非臨床治療標準。</p>
        <div className="grid grid-cols-2 gap-2"><button onClick={save} className="bg-teal-700 text-white rounded-lg py-2 text-sm">{busy?'儲存中…':'儲存新版本'}</button><button onClick={()=>setDraft(null)} className="border border-stone-300 rounded-lg py-2 text-sm">取消</button></div>
      </fieldset>}
      <details className="text-xs text-stone-600"><summary className="cursor-pointer">參數歷史（{history.length} 版）</summary>{history.slice().reverse().map(p=><div key={p.id||p.effective_date} className="border-t border-stone-100 mt-2 pt-2"><p className="font-semibold">{p.effective_date} 生效{p.effective_date>today?'（尚未生效）':''}</p><p>{p.beds} 床 · 占床 {carbonFmt(Number(p.occupancy)*100,0)}% · 用氧 {carbonFmt(Number(p.oxygen_fraction)*100,0)}% · {p.hours} 小時</p><p>係數 {p.carbon_kg_per_litre} kg CO₂e/L · 流量上限 {p.max_flow_lpm} L/min</p><p>累積起始 {p.accumulation_start} · 建立 {p.created_at?new Date(p.created_at).toLocaleString('zh-TW'):''}</p><p>{p.source_note}</p></div>)}</details>
    </>}
    {message&&<p className="text-xs text-stone-700" role="status">{message}</p>}
  </section>;
}

function CarbonMonthlyExport({records,settings,loading,error,recordsLoading,recordsError,onRetry}) {
  const [message,setMessage]=useState('');
  const pending=loading||recordsLoading;
  const problem=error||recordsError;
  const download=()=>{
    setMessage('');
    try {
      const result=C.build(records.filter(r=>CARBON_PROJECT_WARDS.includes(r.ward)),settings.filter(p=>CARBON_PROJECT_WARDS.includes(p.ward)),CARBON_PROJECT_WARDS,new Date());
      exportCarbonRows(result.rows,`氧氣節省與估算減碳_5A_${result.today}.csv`);
    } catch(e){setMessage('匯出失敗：'+e.message);}
  };
  return <section className={carbonPanel+' space-y-3'} aria-label="減碳月報 CSV 匯出">
    <h2 className="text-sm font-semibold text-stone-700">氧氣節省與估算減碳月報</h2>
    <p className="text-xs text-stone-500">5A 專案 · 含每月流量、估算氧氣節省量、估算減碳量與累積估算減碳量。CSV 保留完整精度，缺資料另行標示。</p>
    {problem&&<div className="text-xs text-rose-700" role="alert"><p>{problem}</p><button onClick={onRetry} className="underline mt-1">重新讀取</button></div>}
    <button onClick={download} disabled={pending||!!problem} className="w-full rounded-xl bg-teal-700 text-white py-3 text-sm font-semibold disabled:opacity-50">{pending?'載入中…':'下載減碳月報 CSV'}</button>
    {message&&<p className="text-xs text-rose-700" role="alert">{message}</p>}
  </section>;
}

/* CARBON_UI_END */

// =====================================================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
